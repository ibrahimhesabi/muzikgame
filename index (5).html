<!DOCTYPE html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nota Arena – Müzik Quiz</title>
<style>
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:radial-gradient(circle at 20% 0,#2a1a5e,#0f1020 60%) fixed;color:#f1f1ff;min-height:100vh}
#app{max-width:720px;margin:auto;padding:14px}h1{text-align:center;margin:.4em 0;font-size:2em}h3{margin:.4em 0}
.card{background:#1b1d3acc;border:1px solid #ffffff18;border-radius:16px;padding:14px;margin:10px 0}
button{font:inherit;color:inherit;background:#7c5cff;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
button:hover{filter:brightness(1.15)}button.ghost{background:#ffffff14}button.on{background:#ff4fa3}
.chip{margin:3px;padding:7px 11px;background:#ffffff14;border-radius:99px;font-size:14px}
input,select{font:inherit;padding:10px;border-radius:10px;border:1px solid #ffffff30;background:#0f1020;color:inherit;width:100%}
.row{display:flex;gap:8px;margin:8px 0}.row>*{flex:1}.row>button{flex:0 0 auto}
.big{font-size:56px;text-align:center}.c{text-align:center}.m,small{color:#9a9cc8}
.cv{width:220px;max-width:70%;border-radius:12px;display:block;margin:auto}
.cw{position:relative;width:240px;max-width:80%;margin:auto;overflow:hidden;border-radius:12px}.cw .cv{width:100%;max-width:100%}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;inset:0}.tiles b{background:#0f1020}
.bar{height:6px;background:#ffffff18;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#7c5cff,#ff4fa3)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}.opts button{background:#ffffff14;min-height:52px}
.pl{display:block;margin:10px auto;padding:14px 26px;font-size:18px;background:#ff4fa3}
.dots span{display:inline-block;width:26px;height:8px;border-radius:5px;background:#ffffff25;margin:2px}.dots .on{background:#2ecc8f}
.pr{display:flex;justify-content:space-between;padding:6px 4px;border-bottom:1px solid #ffffff10}
.code{font-size:38px;letter-spacing:8px;text-align:center;font-weight:800}
.wd{font-size:28px;letter-spacing:5px;text-align:center;margin:10px 0;word-break:break-word}
.kb button{margin:2px;padding:8px 10px;min-width:36px;background:#ffffff14}.kb button:disabled{opacity:.25}
.sc{text-align:center;font-size:26px;letter-spacing:3px}
</style></head><body><div id="app"></div>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=q=>document.querySelector(q),$$=q=>document.querySelectorAll(q),rnd=n=>Math.random()*n|0,pick=a=>a[rnd(a.length)],
shuf=a=>{a=a.slice();for(let i=a.length;--i>0;){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a},
esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';'),
norm=s=>String(s).toLocaleLowerCase('tr').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ı/g,'i').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(),
scr=h=>$('#app').innerHTML=h,QT=45;

/* ---- Türler (iTunes arama tohumları) ---- */
const G={
tpop:{n:'Türkçe Pop',e:'🇹🇷',c:'TR',s:['Tarkan','Sezen Aksu','Hadise','Gülşen','Mabel Matiz','Kenan Doğulu','Sertab Erener','Murat Boz','Simge','Hande Yener','Edis','Demet Akalın']},
trock:{n:'Türkçe Rock',e:'🎸',c:'TR',s:['Mor ve Ötesi','Duman','maNga','Teoman','Barış Manço','Cem Karaca','Yüksek Sadakat','Pinhani','Haluk Levent','Athena','Gripin']},
arab:{n:'Arabesk',e:'🥀',c:'TR',s:['Müslüm Gürses','Ferdi Tayfur','Orhan Gencebay','İbrahim Tatlıses','Küçük Ceylan','Bergen','Ahmet Kaya']},
trap:{n:'Türkçe Rap',e:'🎤',c:'TR',s:['Ceza','Sagopa Kajmer','Ezhel','Norm Ender','Contra','Sansar Salvo','Hayki','Gazapizm']},
halk:{n:'Halk & Sanat',e:'🪕',c:'TR',s:['Neşet Ertaş','Zeki Müren','Bülent Ersoy','Müzeyyen Senar','Selda Bağcan','Zülfü Livaneli','Hamiyet Yüceses']},
nost:{n:'Nostalji Pop',e:'📼',c:'TR',s:['Ajda Pekkan','Mustafa Sandal','Yonca Evcimik','Burak Kut','Işın Karaca','Ebru Gündeş','Serdar Ortaç']},
ypop:{n:'Yabancı Pop',e:'🌎',c:'US',s:['Taylor Swift','Ed Sheeran','Dua Lipa','The Weeknd','Ariana Grande','Billie Eilish','Bruno Mars','Adele','Harry Styles','Justin Bieber']},
yrock:{n:'Yabancı Rock',e:'🤘',c:'US',s:['Queen','Nirvana','Metallica','AC/DC','Guns N\' Roses','Linkin Park','Coldplay','Red Hot Chili Peppers','Foo Fighters','Green Day','Imagine Dragons']},
yrap:{n:'Yabancı Hip-Hop',e:'🎧',c:'US',s:['Eminem','Drake','Kendrick Lamar','50 Cent','Jay-Z','Travis Scott','Snoop Dogg','Post Malone']},
dance:{n:'Dance / Elektronik',e:'🪩',c:'US',s:['Calvin Harris','David Guetta','Avicii','Daft Punk','Martin Garrix','Kygo','Swedish House Mafia']},
r80:{n:'80\'ler & 90\'lar',e:'📻',c:'US',s:['Michael Jackson','Madonna','Prince','Whitney Houston','a-ha','Backstreet Boys','Spice Girls','Britney Spears']},
latin:{n:'Latin',e:'💃',c:'US',s:['Shakira','Luis Fonsi','Bad Bunny','Enrique Iglesias','J Balvin','Ricky Martin']},
kpop:{n:'K-Pop',e:'🇰🇷',c:'US',s:['BTS','BLACKPINK','TWICE','Stray Kids','NewJeans']}};

/* ---- 15 oyun ---- */
const M={
heardle:{n:'Heardle',e:'🎧',k:'aud',st:[1,2,4,7,11,16],s:0},
rast:{n:'Rastgele Kesit',e:'🎯',k:'aud',st:[2,4,7,11],s:'r'},
son:{n:'Son Saniyeler',e:'⏳',k:'aud',st:[1,2,4,6],s:24},
derin:{n:'Derin Ses',e:'🐻',k:'aud',st:[12,12,12],s:2,rate:.6,pf:1},
sincap:{n:'Sincap Sesi',e:'🐿️',k:'aud',st:[8,8,8],s:2,rate:1.8,pf:1},
blur:{n:'Bulanık Kapak',e:'🌫️',k:'vis'},
tile:{n:'Kapak Puzzle',e:'🧩',k:'vis'},
ad:{n:'Şarkı Adı (4 şık)',e:'🎼',k:'mc'},
sanatci:{n:'Sanatçı Bul',e:'🎤',k:'mc'},
album:{n:'Albüm Bul',e:'💿',k:'mc'},
yil:{n:'Yıl Tahmini',e:'📅',k:'yil'},
eski:{n:'Hangisi Eski?',e:'⏪',k:'eski'},
ana:{n:'Anagram',e:'🔀',k:'ana'},
adam:{n:'Adam Asmaca',e:'🪢',k:'adam'},
karma:{n:'Karma (hepsi)',e:'🎲'}};

/* ---- Veri: iTunes Search API ---- */
const cache={};
function it(term,c){const k=term+c;if(cache[k])return Promise.resolve(cache[k]);
const u=`https://itunes.apple.com/search?term=${encodeURIComponent(term)}&media=music&entity=song&attribute=artistTerm&limit=25&country=${c}`;
return fetch(u).then(r=>r.json()).catch(()=>new Promise((ok,no)=>{const f='cb'+rnd(1e9),s=document.createElement('script');window[f]=d=>{ok(d);s.remove()};s.onerror=no;s.src=u+'&callback='+f;document.head.append(s)}))
.then(d=>cache[k]=d.results.filter(x=>x.previewUrl&&x.trackName).map(x=>({t:x.trackName.replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+.*$/,'').trim(),a:x.artistName,p:x.previewUrl,i:(x.artworkUrl100||'').replace('100x100','400x400'),y:+(x.releaseDate||'0').slice(0,4),al:(x.collectionName||'').replace(/\s*[\(\[].*?[\)\]]/g,'').replace(/\s+-\s+(Single|EP)$/i,'')})))}
async function build(gs){const n=Math.min(5,Math.max(2,Math.ceil(10/gs.length)));let sd=[];gs.forEach(k=>shuf(G[k].s).slice(0,n).forEach(s=>sd.push([s,G[k].c])));
const seen=new Set(),out=[];(await Promise.all(shuf(sd).slice(0,12).map(([s,c])=>it(s,c).catch(()=>[])))).flat().forEach(t=>{const k=norm(t.t)+norm(t.a);if(t.t&&t.y&&!seen.has(k)){seen.add(k);out.push(t)}});return out}
function mk(pool,c){const T=shuf(pool),ids=Object.keys(M).slice(0,-1),qs=[];
for(let k=0;k<c.n;k++){let m=pick(c.m);if(m=='karma')m=pick(ids);const tr=T[k];
if(m=='album'&&!tr.al||(m=='ana'||m=='adam')&&!/[a-z]{3}/.test(norm(tr.t)))m='ad';
const q={m,tr,rs:rnd(16),sw:rnd(2)};
const od=f=>{const o=[tr[f]];for(const x of shuf(T))if(x[f]&&!o.includes(x[f])){o.push(x[f]);if(o.length>3)break}return shuf(o)};
if(m=='ad')q.o=od('t');if(m=='sanatci')q.o=od('a');if(m=='album')q.o=od('al');
if(m=='eski')q.t2=T.find(x=>Math.abs(x.y-tr.y)>1)||T[c.n];
if(m=='ana')q.sc=tr.t.toLocaleUpperCase('tr').split(' ').map(w=>{let s=w;for(let i=0;i<6&&s==w&&w.length>1;i++)s=shuf(w.split('')).join('');return s}).join(' ');
qs.push(q)}return qs}

/* ---- Ses ---- */
const A=new Audio();let au,ta;
const SIL='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';
addEventListener('pointerdown',()=>{if(!A.src){A.src=SIL;A.play().catch(()=>{})}},{once:true});
const stopAu=()=>{clearTimeout(ta);A.pause()};
function play(u,s=0,d=0,r=1,pf=0){clearTimeout(ta);A.pause();A.onloadedmetadata=A.onplaying=null;
A.src=u;A.preservesPitch=A.mozPreservesPitch=A.webkitPreservesPitch=!pf;A.playbackRate=r;
A.onloadedmetadata=()=>{if(s)A.currentTime=s;A.playbackRate=r};
A.onplaying=()=>{clearTimeout(ta);if(d)ta=setTimeout(()=>A.pause(),d*1000)};
const p=A.play();if(p)p.catch(()=>{})}

/* ---- Ağ (PeerJS, host-merkezli) ---- */
let me={n:localStorage.n||'',av:localStorage.av||'😎'},peer,hc,host=0,code='',P={},cfg={g:['tpop','ypop','trock'],m:['karma'],n:10},qs=[],titles=[],L={},tmr,rv,inGame=0,cur=0;const conns={};
const bc=m=>{Object.values(conns).forEach(c=>c.open&&c.send(m));handle(m)};
const ans=p=>host?hrecv({t:'ans',pts:p},'host'):hc.send({t:'ans',pts:p});
const chk=()=>{if(!rv&&Object.values(P).every(p=>p.d))reveal()};
function mkHost(online){host=1;P={host:{n:me.n,av:me.av,s:0}};code='';
if(!online)return lobby();if(typeof Peer=='undefined'){alert('PeerJS yüklenemedi, internetini kontrol et.');return home()}
const tryC=()=>{code=Array.from({length:4},()=>pick('ABCDEFGHJKLMNPRSTUVYZ')).join('');peer=new Peer('nq-'+code);
peer.on('open',()=>lobby());peer.on('error',e=>e.type=='unavailable-id'?tryC():(alert('Bağlantı hatası: '+e.type),home()));
peer.on('connection',c=>{conns[c.peer]=c;c.on('data',d=>hrecv(d,c.peer));c.on('close',()=>{delete conns[c.peer];delete P[c.peer];inGame?chk():bc({t:'lobby',P,cfg})})})};tryC()}
function hrecv(d,id){
if(d.t=='join'){if(inGame){conns[id].send({t:'busy'});return}P[id]={n:d.n,av:d.av,s:0};bc({t:'lobby',P,cfg})}
if(d.t=='ans'&&inGame&&P[id]&&!P[id].d){const p=P[id];p.d=1;p.s+=d.pts;p.l=d.pts;chk()}}
async function start(){inGame=1;bc({t:'load'});const pool=await build(cfg.g);
if(pool.length<cfg.n+4){inGame=0;alert('Yeterli şarkı bulunamadı (internet / iTunes istek sınırı olabilir). Biraz sonra tekrar dene.');return bc({t:'lobby',P,cfg})}
Object.values(P).forEach(p=>p.s=0);bc({t:'start',qs:mk(pool,cfg),titles:pool.map(x=>x.t+' - '+x.a)});nxt(0)}
function nxt(i){if(i>=qs.length){inGame=0;return bc({t:'end',P})}cur=i;rv=0;Object.values(P).forEach(p=>{p.d=0;p.l=0});bc({t:'q',i});clearTimeout(tmr);tmr=setTimeout(reveal,QT*1000+800)}
function reveal(){if(rv)return;rv=1;clearTimeout(tmr);bc({t:'rev',i:cur,P});tmr=setTimeout(()=>nxt(cur+1),7000)}
function handle(m){
if(m.t=='lobby'){P=m.P;cfg=m.cfg;lobby()}
else if(m.t=='load')scr('<div class="card c"><div class=big>⏳</div><h3>Şarkılar hazırlanıyor…</h3></div>');
else if(m.t=='start'){qs=m.qs;titles=m.titles}
else if(m.t=='q')rq(m.i);else if(m.t=='rev')rrev(m);else if(m.t=='end')rend();
else if(m.t=='busy'){alert('Oyun başlamış, bitmesini bekle.');home()}}
function join(c){if(c.length!=4)return alert('4 harfli oda kodunu yaz');if(typeof Peer=='undefined')return alert('PeerJS yüklenemedi');
scr('<div class="card c"><div class=big>🔌</div><h3>Odaya bağlanılıyor…</h3></div>');
peer=new Peer();const bad=()=>{alert('Oda bulunamadı veya bağlantı kurulamadı');home()},to=setTimeout(bad,10000);
peer.on('error',()=>{clearTimeout(to);bad()});
peer.on('open',()=>{hc=peer.connect('nq-'+c,{reliable:true});hc.on('open',()=>{clearTimeout(to);host=0;hc.send({t:'join',n:me.n,av:me.av})});hc.on('data',handle);hc.on('close',()=>{alert('Bağlantı koptu');home()})})}

/* ---- Ekranlar ---- */
const rank=d=>Object.values(P).sort((a,b)=>b.s-a.s).map(p=>`<div class=pr><span>${p.av} ${esc(p.n)}</span><b>${p.s}${d&&p.l?` <small>+${p.l}</small>`:''}</b></div>`).join('');
function home(){stopAu();clearTimeout(tmr);if(peer){peer.destroy();peer=null}Object.keys(conns).forEach(k=>delete conns[k]);host=0;inGame=0;code='';
const av=['😎','🤩','🦊','🐼','🐸','🦄','🐯','👻','🤖','🎸','🥁','🎧'];
scr(`<h1>🎵 Nota Arena</h1><p class="c m">Hesap yok, kayıt yok. Adını yaz ve çal!</p>
<div class=card><input id=nm maxlength=14 placeholder="Misafir adın" value="${esc(me.n)}"><div class=c style="margin-top:8px">${av.map(a=>`<button class="chip ${a==me.av?'on':''}" data-a="${a}">${a}</button>`).join('')}</div></div>
<div class=card><button id=solo style="width:100%">🎮 Tek Başıma Oyna</button><br><br><button id=mkr style="width:100%">🏠 Oda Kur (arkadaşlarla)</button><br><br>
<div class=row><input id=cd maxlength=4 placeholder="ODA KODU" value="${esc(location.hash.slice(1).toUpperCase())}" style="text-transform:uppercase"><button id=jn>Katıl</button></div></div>`);
$$('[data-a]').forEach(b=>b.onclick=()=>{me.av=b.dataset.a;$$('[data-a]').forEach(x=>x.classList.toggle('on',x==b))});
const sv=()=>{me.n=$('#nm').value.trim()||'Misafir'+(100+rnd(900));try{localStorage.n=me.n;localStorage.av=me.av}catch(e){}};
$('#solo').onclick=()=>{sv();mkHost(0)};$('#mkr').onclick=()=>{sv();mkHost(1)};$('#jn').onclick=()=>{sv();join($('#cd').value.trim().toUpperCase())}}
function lobby(){const ed=host;
scr(`<h1>🎵 Lobi</h1>`+(code?`<div class=card><div class="c m">Oda kodu</div><div class=code>${code}</div><button class=ghost id=cp style="width:100%">🔗 Davet linkini kopyala</button></div>`:'')+
`<div class=card><h3>Oyuncular (${Object.keys(P).length})</h3>${rank(0)}</div>
<div class=card><h3>Müzik türleri</h3>${Object.entries(G).map(([k,g])=>`<button class="chip ${cfg.g.includes(k)?'on':''}" data-g="${k}">${g.e} ${g.n}</button>`).join('')}</div>
<div class=card><h3>Oyunlar</h3>${Object.entries(M).map(([k,g])=>`<button class="chip ${cfg.m.includes(k)?'on':''}" data-m="${k}">${g.e} ${g.n}</button>`).join('')}
<h3>Tur sayısı</h3>${[5,10,15,20].map(n=>`<button class="chip ${cfg.n==n?'on':''}" data-n="${n}">${n}</button>`).join('')}</div>`+
(ed?'<button id=go style="width:100%;font-size:18px">▶ Oyunu Başlat</button>':'<p class="c m">Ayarları host seçer, oyun otomatik başlar…</p>')+'<br><br><button class=ghost id=hm style="width:100%">Çık</button>');
if(code)$('#cp').onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(location.href.split('#')[0]+'#'+code);$('#cp').textContent='✅ Kopyalandı'};
$('#hm').onclick=home;if(!ed)return;
const sel=(a,v)=>{const i=a.indexOf(v);if(i<0)a.push(v);else if(a.length>1)a.splice(i,1);bc({t:'lobby',P,cfg})};
$$('[data-g]').forEach(b=>b.onclick=()=>sel(cfg.g,b.dataset.g));$$('[data-m]').forEach(b=>b.onclick=()=>sel(cfg.m,b.dataset.m));
$$('[data-n]').forEach(b=>b.onclick=()=>{cfg.n=+b.dataset.n;bc({t:'lobby',P,cfg})});$('#go').onclick=start}

/* ---- Oyun ---- */
const gin=dl=>`<div class=row><input id=gi ${dl===0?'':'list=dl'} placeholder="Şarkı adı…" autocomplete=off><button id=gb>Tahmin</button></div>`+(dl===0?'':`<datalist id=dl>${titles.map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`);
const gw=cb=>{const f=()=>{const v=$('#gi').value.trim();if(v){$('#gi').value='';cb(v)}};$('#gb').onclick=f;$('#gi').onkeydown=e=>e.key=='Enter'&&f()};
const ok=v=>norm(v.split(' - ')[0])==norm(L.q.tr.t);
const pts=()=>Math.max(30,Math.round(100+100*Math.max(0,1-(Date.now()-L.t0)/1e3/QT)-20*L.w));
function fin(p,msg){if(L.d)return;L.d=1;stopAu();$('#st').innerHTML=`<div class=big>${p?'✅':'❌'}</div><h3 class=c>${esc(msg||'')}</h3><p class=c>+${p} puan · diğerleri bekleniyor…</p>`;ans(p)}
function rq(i){const q=qs[i],m=M[q.m],t=q.tr;L={i,q,m,st:0,w:0,t0:Date.now(),d:0,g:new Set()};
scr(`<div class=card><div class=row style="justify-content:space-between;margin:0"><b>Tur ${i+1}/${qs.length}</b><b>${m.e} ${m.n}</b></div></div><div class=bar><i id=bar></i></div><div class=card id=st></div><div class=card id=sb>${rank(0)}</div>`);
setTimeout(()=>{const b=$('#bar');if(b){b.style.transition=`width ${QT}s linear`;b.style.width='0'}},60);
const S=h=>$('#st').innerHTML=h;
if(m.k=='aud'){const go=()=>play(t.p,m.s=='r'?q.rs:m.s,m.st[L.st],m.rate||1,m.pf);
S(`<div class=c id=ds></div><button class=pl id=pl></button>${gin()}<button class=ghost id=sk style="width:100%">⏭ Pas (sonraki ipucu)</button>`);
const u=()=>{$('#ds').className='dots';$('#ds').innerHTML=m.st.map((_,j)=>`<span class="${j<=L.st?'on':''}"></span>`).join('');$('#pl').textContent=`▶ Çal (${m.st[L.st]} sn)`};
const wr=()=>{L.w++;if(L.st<m.st.length-1){L.st++;u();go()}else fin(0,'Hakların bitti')};
u();go();$('#pl').onclick=go;$('#sk').onclick=wr;gw(v=>ok(v)?fin(pts(),'Doğru!'):wr())}
else if(m.k=='vis'){const bl=[30,22,15,9,5,2],tl=shuf([...Array(16).keys()]),bq=q.m=='blur';
S(`<div class=cw><img class=cv id=im src="${esc(t.i)}">${bq?'':'<div class=tiles>'+'<b></b>'.repeat(16)+'</div>'}</div><p class="c m">Kapaktan şarkıyı bul</p>${gin()}<button class=ghost id=sk style="width:100%">⏭ Pas (ipucu aç)</button>`);
const rv_=()=>{if(bq)$('#im').style.filter=`blur(${bl[Math.min(L.w,5)]}px)`;else $$('.tiles b').forEach((b,j)=>{if(tl.indexOf(j)<2+3*L.w)b.style.opacity=0})};
const wr=()=>{L.w++;rv_();if(bq?L.w>5:2+3*L.w>=16)fin(0,'Bulamadın')};
rv_();$('#sk').onclick=wr;gw(v=>ok(v)?fin(pts(),'Doğru!'):wr())}
else if(m.k=='mc'){play(t.p);const lab={ad:'Bu şarkının adı ne?',sanatci:'Bu şarkıyı kim söylüyor?',album:'Hangi albümden?'}[q.m],an={ad:t.t,sanatci:t.a,album:t.al}[q.m];
S(`<p class=c>${lab}</p><button class=pl id=pl>▶ Tekrar çal</button><div class=opts>${q.o.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>`);
$('#pl').onclick=()=>play(t.p);$$('.opts button').forEach(b=>b.onclick=()=>b.dataset.o==an?fin(pts(),'Doğru!'):fin(0,'Yanlış'))}
else if(m.k=='yil'){play(t.p);S(`<p class=c>Bu şarkı hangi yıl çıktı?</p><button class=pl id=pl>▶ Tekrar çal</button><div class=big id=yv>2000</div><input type=range id=yr min=1960 max=2026 value=2000 style="padding:0"><br><br><button id=gb style="width:100%">Onayla</button>`);
$('#pl').onclick=()=>play(t.p);$('#yr').oninput=e=>$('#yv').textContent=e.target.value;
