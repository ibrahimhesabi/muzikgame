<!DOCTYPE html>

<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1b232e;--card:#242e39d9;--line:#95a0a326;--a:#4d5c63;--b:#95a0a3;--c:#666f70;--g:#8fd3b4;--t:#eef1f1;--m:#95a0a3;--on:#1b232e;--grad:linear-gradient(135deg,#95a0a3,#666f70)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:16px/1.4 'Outfit',system-ui,sans-serif;background:var(--bg);color:var(--t);min-height:100vh;overflow-x:hidden}

#app{padding:30px 30px 22px;animation:fi .35s}@keyframes fi{from{opacity:0;transform:translateY(8px)}}
.logo{text-align:center;font-size:48px;font-weight:800;margin:10px 0 0;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-1.5px}

h2{font-size:14px;text-transform:uppercase;letter-spacing:1.6px;color:var(--m);margin:26px 4px 10px;font-weight:600;display:flex;align-items:center;gap:8px}
h2 b{background:var(--grad);color:var(--on);border-radius:8px;padding:2px 9px;letter-spacing:0}h3{margin:.3em 0}
.card{--m:#b4bec0;background:linear-gradient(145deg,#4d5c6366,#4d5c6330);border:1px solid #95a0a33d;border-radius:30px;padding:22px;margin:18px 0;box-shadow:0 12px 40px #00000030}.card>h2:first-child{margin-top:0}
button{font:inherit;color:inherit;border:0;cursor:pointer;transition:.15s}
.btn{background:var(--grad);padding:15px 20px;border-radius:16px;font-weight:600;width:100%;box-shadow:0 10px 30px #00000040;color:var(--on)}
.btn:hover{transform:translateY(-2px)}.btn.ghost{background:#ffffff12;box-shadow:none;color:var(--t)}
input{font:inherit;padding:15px;border-radius:16px;border:1px solid var(--line);background:#161d26;color:var(--t);width:100%;outline:0}input:focus{border-color:var(--a);box-shadow:0 0 0 3px #95a0a333}
.row{display:flex;gap:10px;align-items:center}.row>input{flex:1;min-width:0}.row>.btn{width:auto}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:12px}.avs button{font-size:26px;background:#ffffff0d;border-radius:14px;padding:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.tile{position:relative;text-align:left;background:#ffffff09;border:1px solid var(--line);border-radius:18px;padding:14px}
.tile .e{font-size:24px;display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:#ffffff10;margin-bottom:8px}.tile b{display:block;font-weight:600}.tile small{color:var(--m);font-size:12.5px;line-height:1.25;display:block;margin-top:2px}
.tile.on{background:linear-gradient(135deg,#95a0a333,#4d5c6340);border-color:var(--b)}.tile.on .e{background:var(--grad)}.tile.on:after{content:"✓";position:absolute;top:10px;right:12px;color:var(--g);font-weight:800}
.ro button,.ro input{pointer-events:none;opacity:.85}
.seg{display:flex;gap:8px}.seg button{flex:1;padding:13px;border-radius:14px;background:#ffffff0d;font-weight:600}.seg .on,.tabs .on,.chip.on{background:var(--grad);color:var(--on)}
.tabs{display:flex;gap:6px;overflow-x:auto;max-width:100%;padding-bottom:8px;margin-bottom:6px}.tabs button{white-space:nowrap;padding:9px 14px;border-radius:12px;background:#ffffff0d;font-size:14px}
.chip{padding:8px 13px;border-radius:99px;background:#ffffff0f;border:1px solid var(--line);font-size:14px;margin:3px 2px}
.pls{display:flex;gap:8px;flex-wrap:wrap}.pls span{background:#ffffff10;padding:8px 14px;border-radius:99px}
.code{font-size:50px;font-weight:800;letter-spacing:10px;text-align:center;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stick{position:sticky;bottom:0;padding:28px 0 8px;background:linear-gradient(#1b232e00,#1b232e 45%);margin-top:10px;z-index:5}
.hd{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#ffffff12;padding:6px 12px;border-radius:99px;font-size:14px}.mode{font-weight:800;font-size:18px}
.ring{position:relative;width:54px;height:54px}.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:5}
.rb{stroke:#ffffff18}.rf{stroke:var(--b);stroke-dasharray:138.2;stroke-dashoffset:0;stroke-linecap:round}.ring b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}
.vin{width:150px;height:150px;margin:6px auto 14px;border-radius:50%;background:radial-gradient(circle,#95a0a3 0 13%,#1b232e 14% 16%,transparent 17%),repeating-radial-gradient(circle,#2a343f 0 3px,#151b23 4px 6px);box-shadow:0 10px 50px #4d5c6399;border:2px solid #ffffff18}
.air .vin{animation:sp 2.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.play{display:block;margin:0 auto 14px;background:var(--b);color:var(--on);padding:12px 28px;border-radius:99px;font-weight:600;box-shadow:0 6px 24px #00000055}
.dots{text-align:center;margin-bottom:8px}.dots span{display:inline-block;width:28px;height:7px;border-radius:5px;background:#ffffff22;margin:2px}.dots .on{background:var(--g)}
.hint{color:var(--m);text-align:center;margin:0 0 12px}

.tiles{display:grid;grid-template-columns:repeat(4,1fr);position:absolute;inset:0}.tiles b{background:#1b232e;transition:.4s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:#ffffff0d;border:1px solid var(--line);border-radius:16px;padding:14px;min-height:58px;font-weight:600}.opt:hover{border-color:var(--b);background:#95a0a322}
.opt img{width:100%;max-width:105px;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;margin:0 auto 8px}.opt span{font-size:13px;display:block}
.cv{width:200px;max-width:65%;display:block;margin:4px auto 10px;border-radius:18px;box-shadow:0 10px 40px #000a}
.wd{font-size:28px;font-weight:800;letter-spacing:5px;text-align:center;margin:12px 0;word-break:break-word}
.kb{text-align:center}.kb button{margin:3px;width:38px;height:42px;border-radius:10px;background:#ffffff12;font-weight:600}.kb button:disabled{opacity:.2}
.res{font-size:60px;text-align:center}
.pr{display:flex;align-items:center;gap:10px;padding:10px 6px;border-bottom:1px solid var(--line)}.pr:last-child{border:0}.pr i{width:28px;font-style:normal;color:var(--m)}.pr span{flex:1}.pr b{font-size:18px}.pr small{color:var(--g)}

.sk{margin-top:10px}
.btn:disabled{opacity:.35;transform:none;cursor:not-allowed}.btn small{display:block;font-weight:400;font-size:11px;opacity:.85}
.av{position:relative;width:120px;height:120px;border-radius:50%;margin:6px auto 10px;display:grid;place-items:center;font-size:40px;font-weight:800;background:var(--grad);overflow:hidden;box-shadow:0 10px 40px #4d5c6377}.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.stars{color:#d9c58a;letter-spacing:3px;font-size:22px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.three .btn{padding:12px 4px;font-size:18px}
.bar{height:8px;border-radius:5px;background:#ffffff18;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;width:100%;background:var(--grad);transition:width .15s linear}
#vol{display:flex;align-items:center;gap:6px;background:#ffffff0d;border:1px solid var(--line);border-radius:99px;padding:3px 14px 3px 4px}
#vol button{font-size:20px;background:none;width:34px;height:34px;padding:0}
#vol input{flex:1;min-width:60px;width:auto;padding:0;border:0;background:none;box-shadow:none;accent-color:#95a0a3;height:24px;border-radius:0}

/* ---- Yeni yerleşim: sol profil paneli + sağ içerik paneli ---- */
.shell{max-width:1180px;margin:0 auto;padding:24px;display:grid;grid-template-columns:minmax(240px,1fr) minmax(0,2fr);gap:28px;align-items:start}.shell>*{min-width:0}
.side{position:sticky;top:24px;height:calc(100vh - 48px);display:flex;flex-direction:column;gap:18px;padding:24px 22px;background:#242e39d9;border:1px solid var(--line);border-radius:22px;backdrop-filter:blur(14px)}
.me{display:flex;align-items:center;gap:16px;min-width:0}
.mav{width:84px;height:84px;flex:none;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:44px;box-shadow:0 0 0 4px #4d5c6366,0 10px 30px #4d5c6355}
.mn{font-size:30px;font-weight:800;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.sinfo{display:flex;flex-wrap:wrap;gap:8px}.sinfo:empty{display:none}
.sidepl{flex:1;min-height:0;overflow:auto;display:flex;flex-direction:column;gap:6px}
.sidepl .sh{font-size:12px;text-transform:uppercase;letter-spacing:1.6px;color:var(--m);font-weight:600;margin:4px 2px}
.sp{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;border-radius:14px;background:#ffffff0a}.sp.you{background:#4d5c6388}.sp span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sp b{white-space:nowrap}
.panel{min-width:0;overflow:clip;background:#1b232ee6;border:1px solid var(--line);border-radius:56px 56px 24px 24px;min-height:calc(100vh - 48px);backdrop-filter:blur(14px)}
.card .tile:not(.on),.card .chip:not(.on){background:#161d2688}
.card .seg button:not(.on),.card .tabs button:not(.on){background:#161d2688}
@media(min-width:821px){.lobpl{display:none}}
@media(max-width:820px){
.shell{grid-template-columns:1fr;padding:12px;gap:12px}
.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px 14px;gap:10px 14px}
.mav{width:48px;height:48px;font-size:26px;box-shadow:0 0 0 3px #4d5c6366}.me{gap:12px}.mn{font-size:20px}
.sidepl{display:none}#vol{margin-left:auto;min-width:150px}
.panel{min-height:0;border-radius:32px 32px 18px 18px}
#app{padding:20px 14px 18px}.logo{font-size:40px}
}

/* ---- Profil ekranı (deniz paleti) ---- */
.ava{display:inline-grid;place-items:center;width:1.5em;height:1.5em;border-radius:50%;overflow:hidden;vertical-align:middle;background:#ffffff14;font-size:inherit;flex:none}
.ava img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;display:block}
.mav{overflow:hidden}.mav .ava{width:100%;height:100%}
.prof{padding:18px}
.prow{display:grid;grid-template-columns:minmax(120px,1fr) minmax(0,1.7fr) minmax(120px,1fr);gap:18px;align-items:center}
.bigav{position:relative;width:100%;aspect-ratio:1;max-width:210px;margin:0 auto;border-radius:50%;overflow:hidden;cursor:pointer;background:#c9d2da;box-shadow:0 10px 40px #00000066,0 0 0 4px #95a0a355;display:block;padding:0;transition:.2s}
.bigav:hover{transform:scale(1.03);box-shadow:0 10px 40px #00000066,0 0 0 4px #95a0a3}

.bigav .cam{position:absolute;right:8%;bottom:8%;width:34px;height:34px;border-radius:50%;background:var(--grad);color:var(--on);display:grid;place-items:center;font-size:17px;box-shadow:0 4px 12px #0007;z-index:2}
.namebox{background:#4d5c6388;border:1px solid var(--line);border-radius:26px;padding:16px;display:flex;flex-direction:column;gap:10px}
.namebox label{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--m);font-weight:600}
.namebox input{background:#161d26;font-size:20px;font-weight:600}
.mini{display:flex;gap:8px;flex-wrap:wrap}.mini button{flex:1;min-width:110px;padding:9px 10px;border-radius:12px;background:#ffffff14;font-size:13px;font-weight:600}.mini button:hover{background:#ffffff24}.mini button:disabled{opacity:.4;cursor:not-allowed}
.wheelbox{position:relative;width:100%;aspect-ratio:1;max-width:210px;margin:0 auto;touch-action:none}
.wheelbox canvas{width:100%;height:100%;border-radius:50%;display:block;cursor:crosshair;box-shadow:0 10px 30px #0007,0 0 0 3px #95a0a355}
.knob{position:absolute;width:20px;height:20px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #0008,0 2px 8px #0008;transform:translate(-50%,-50%);pointer-events:none;left:50%;top:50%}
.lum{display:flex;align-items:center;gap:10px;margin:14px 4px 0}.lum span{font-size:13px;color:var(--m);white-space:nowrap}
.lum input{flex:1;padding:0;height:26px;border:0;background:none;accent-color:#95a0a3;box-shadow:none}
.presets{margin-top:14px;background:#4d5c6366;border:1px solid var(--line);padding:16px 12px;border-radius:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:12px 8px}
.pre{position:relative;aspect-ratio:1;border-radius:50%;overflow:hidden;background:#c9d2da;padding:0;transition:.15s;box-shadow:0 4px 14px #0005}
.pre:hover{transform:translateY(-3px) scale(1.04)}.pre.on{box-shadow:0 0 0 3px #1b232e,0 0 0 6px var(--b)}
.pre svg,.pre img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.pre.busy:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,#0000 30%,#ffffff66 50%,#0000 70%);background-size:200% 100%;animation:sh 1.1s linear infinite}
@keyframes sh{from{background-position:200% 0}to{background-position:-200% 0}}
.pre small{position:absolute;left:0;right:0;bottom:0;background:#1b232ecc;color:var(--t);font-size:10px;text-align:center;padding:2px 0;opacity:0;transition:.15s}.pre:hover small{opacity:1}
.pnote{font-size:12.5px;color:var(--m);margin:10px 4px 0;min-height:1.2em}
.jump{display:flex;justify-content:center;margin:0 0 4px}.jump button{padding:10px 18px;border-radius:99px;background:var(--grad);color:var(--on);font-weight:700;box-shadow:0 8px 24px #0005}
@media(max-width:620px){.prow{grid-template-columns:1fr 1fr}.namebox{grid-column:1/-1;order:3}.bigav,.wheelbox{max-width:150px}.presets{grid-template-columns:repeat(5,1fr);gap:8px 6px;padding:12px 8px}}

/* Ünlü fotoğrafı: Wikipedia (sayfa + arama) → Deezer sanatçı resmi → (üyeler için) grubun resmi. Resimsiz ünlü çıkmasın diye eksikler yenisiyle değişir */
const FC={};try{Object.assign(FC,JSON.parse(localStorage.fc1||'{}'))}catch(e){}
const BIO=/şarkıcı|rapçi|müzisyen|besteci|söz yazarı|solist|grup|oyuncu|sanatçı|singer|rapper|musician|songwriter|vocalist|band|actor|actress|dancer|idol/i,
tm=(t,n)=>{const a=norm(t),b=norm(n);return a==b||a.startsWith(b+' ')||b.split(' ').every(w=>a.includes(w))||lev(a,b)<=Math.max(1,Math.floor(b.length/6))},
WQ={'Ceza':['Ceza (rapçi)','Ceza (rapper)'],'Hadise':['Hadise Açıkgöz','Hadise'],'Mero':['Mero (rapçi)'],'Sıla':['Sıla Gençoğlu'],'Edis':['Edis (şarkıcı)'],'Simge':['Simge Sağın'],'Tarkan':['Tarkan Tevetoğlu','Tarkan']};
async function wiki(lang,t){try{const r=await fetch(`https://${lang}.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(t.replace(/ /g,'_'))}?redirect=true`);if(!r.ok)return'';const d=await r.json();
if(d.type=='disambiguation'||!d.thumbnail)return'';if(!tm(d.title||'',t.replace(/ \(.*\)$/,'')))return'';if(!BIO.test((d.description||'')+' '+(d.extract||'')))return'';return d.thumbnail.source.replace(/\/\d+px-/,'/500px-')}catch(e){return''}}
async function wsearch(lang,q,name){try{const r=await fetch(`https://${lang}.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=6&gsrsearch=${encodeURIComponent(q)}&prop=pageimages|description&piprop=thumbnail&pithumbsize=500`);
const d=await r.json(),ps=Object.values((d.query||{}).pages||{}).sort((a,b)=>a.index-b.index);for(const p of ps)if(p.thumbnail&&tm(p.title,name)&&BIO.test(p.description||''))return p.thumbnail.source;return''}catch(e){return''}}
async function dzPic(name){try{const r=await jp('https://api.deezer.com/search/artist?limit=5&q='+encodeURIComponent(name)),a=(r.data||[]).find(x=>norm(x.name)==norm(name));return a?(a.picture_big||a.picture_medium||''):''}catch(e){return''}}
async function face(c){if(FC[c.n]){c.img=FC[c.n];return}
let u='';for(const t of WQ[c.n]||[c.n]){u=await wiki('tr',t)||await wiki('en',t);if(u)break}
const ex=c.k=='tmem'?' '+c.sub:'';
if(!u)u=await wsearch('tr',c.n+ex,c.n)||await wsearch('en',c.n+ex,c.n);
if(!u)u=await dzPic(c.n);
if(!u&&c.k=='tsing'){const id=await findId(c.n);if(id){const r=await jp('https://api.deezer.com/artist/'+id);u=r.picture_big||r.picture_medium||''}}
if(u){c.img=u;FC[c.n]=u;try{localStorage.fc1=JSON.stringify(FC)}catch(e){}return}
if(c.k=='tmem'){const id=await findId(c.sub);if(id){const r=await jp('https://api.deezer.com/artist/'+id);u=r.picture_big||r.picture_medium||'';if(u){c.img=u;c.grp=1}}}}
async function astart(){inGame=1;rv=1;bc({t:'au_load'});

const all=shuf(cfg.ac.flatMap(k=>CE[k].l.map(x=>({n:x[0],sub:x[1],st:x[2],k})))),fresh=all.filter(c=>!AH.includes(c.n)),src=fresh.length>=AUN*2?fresh:all,cs=[],cnt={};
const Q={5:2,4:3,3:3,2:2};for(const c of src){if(cs.length>=AUN)break;if(!Q[c.st]||(c.k=='tmem'&&(cnt[c.sub]||0)>=2))continue;Q[c.st]--;cnt[c.sub]=(cnt[c.sub]||0)+1;cs.push(c)}
for(const c of src.concat(all)){if(cs.length>=AUN)break;if(!cs.includes(c))cs.push(c)}const rc=c=>Promise.race([face(c),new Promise(r=>setTimeout(r,7000))]).catch(()=>{});
await Promise.all(cs.map(rc));
{let ex=shuf(src.filter(x=>!cs.includes(x))),t=0;while(cs.some(c=>!c.img)&&ex.length&&t++<3){const bad=cs.filter(c=>!c.img),rep=ex.splice(0,bad.length+3);await Promise.all(rep.map(rc));

function wheel(){const c=$('#wh'),x=c.getContext('2d'),W=c.width,R=W/2,id=x.createImageData(W,W);
for(let j=0;j<W;j++)for(let i=0;i<W;i++){const dx=i+.5-R,dy=j+.5-R,d=Math.hypot(dx,dy);if(d>R)continue;const[r,g,b]=hsv((Math.atan2(-dy,dx)*180/Math.PI+360)%360,d/R,1),k=(j*W+i)*4;id.data[k]=r;id.data[k+1]=g;id.data[k+2]=b;id.data[k+3]=255}
x.putImageData(id,0,0);let dr=0;

c.onpointerdown=e=>{if(mv(e)){dr=1;c.setPointerCapture(e.pointerId)}};c.onpointermove=e=>{if(dr)mv(e)};c.onpointerup=c.onpointercancel=()=>{dr=0}}
